version: '3.8'

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-bookhub
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Pa$$w0rd123!"
    ports:
      - "1433:1433"
    restart: unless-stopped

  bookhub-back:
    build: .
    container_name: bookhub-back
    depends_on:
      - sqlserver
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=BOOKHUB;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: Pa$$w0rd123!